name: NexVora Voice Studio - Direct APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version prefix"
        type: string
        required: true
        default: "v1.0.1"
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: nexvora-voice-studio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish installable APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK
        working-directory: mobile/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Install required Android NDK and CMake
        working-directory: mobile/android
        run: bash install-sdk-packages.sh

      - name: Configure APK signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NEXVORA_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.NEXVORA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.NEXVORA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.NEXVORA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/nexvora-release.jks"

          if [[ -n "${KEYSTORE_B64:-}" && -n "${KEYSTORE_PASSWORD_SECRET:-}" && -n "${KEY_ALIAS_SECRET:-}" && -n "${KEY_PASSWORD_SECRET:-}" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD_SECRET" -alias "$KEY_ALIAS_SECRET" >/dev/null
            STORE_PASSWORD="$KEYSTORE_PASSWORD_SECRET"
            ALIAS="$KEY_ALIAS_SECRET"
            KEY_PASSWORD="$KEY_PASSWORD_SECRET"
          else
            STORE_PASSWORD="$(openssl rand -hex 24)"
            ALIAS="nexvora-ci"
            KEY_PASSWORD="$STORE_PASSWORD"

            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE" -storetype JKS \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=NexVora Voice Studio, O=NexVora Lab's Ofc"

            echo "::warning::Temporary signing key used. Future updates signed with a different key may not install over this app."
          fi

          {
            echo "NEXVORA_ANDROID_KEYSTORE=$KEYSTORE"
            echo "NEXVORA_ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "NEXVORA_ANDROID_KEY_ALIAS=$ALIAS"
            echo "NEXVORA_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run unit tests
        id: tests
        continue-on-error: true
        working-directory: mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build installable Debug and Release APKs
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon --stacktrace clean assembleDebug assembleRelease

      - name: Collect and validate APK files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          DEBUG_APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="mobile/android/app/build/outputs/apk/release/app-release.apk"

          test -s "$DEBUG_APK" || {
            echo "::error::Debug APK was not generated"
            exit 1
          }

          test -s "$RELEASE_APK" || {
            echo "::error::Release APK was not generated"
            exit 1
          }

          cp "$DEBUG_APK" dist/NexVora-Voice-Studio-Debug.apk
          cp "$RELEASE_APK" dist/NexVora-Voice-Studio.apk

          echo "Generated APK files:"
          ls -lh dist/*.apk
          file dist/*.apk

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose dist/NexVora-Voice-Studio.apk
          "$APKSIGNER" verify --verbose dist/NexVora-Voice-Studio-Debug.apk

      - name: Publish direct APK download links
        if: >
          success() &&
          (
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            startsWith(github.ref, 'refs/tags/v')
          )
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && format('{0}-build.{1}', inputs.tag, github.run_number) || format('v1.0.0-build.{0}', github.run_number) }}
          name: NexVora Voice Studio Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/NexVora-Voice-Studio.apk
            dist/NexVora-Voice-Studio-Debug.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            # NexVora Voice Studio

            Direct Android APK downloads:

            - NexVora-Voice-Studio.apk — Release
            - NexVora-Voice-Studio-Debug.apk — Debug

            Developed by Prince AR Abdur Rahman.
            Published by NexVora Lab's Ofc.
            License: AGPL-3.0

      - name: Build report
        if: always()
        shell: bash
        run: |
          {
            echo "## NexVora Voice Studio APK Build"
            echo "- Commit: $GITHUB_SHA"
            echo "- Unit tests: ${{ steps.tests.outcome }}"
            echo "- APK build/publish job: ${{ job.status }}"
            echo ""
            if [[ -d dist ]]; then
              echo "### APK files"
              ls -lh dist/*.apk 2>/dev/null || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          
