name: NexVora Voice Studio - Direct APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish direct APK files to GitHub Releases"
        type: boolean
        required: true
        default: true
      tag:
        description: "Release version tag"
        type: string
        required: true
        default: "v1.0.1"

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: nexvora-voice-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    defaults:
      run:
        working-directory: mobile/android

    steps:

      # 1. Checkout source
      - name: Checkout Repository
        uses: actions/checkout@v5

      # 2. Setup Java
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Android SDK
      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Android SDK configured"

      # 5. Install NDK and CMake
      - name: Install Android Native Dependencies
        run: |
          bash install-sdk-packages.sh

      # 6. Prepare signing key
      - name: Configure APK Signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.NEXVORA_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEXVORA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXVORA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXVORA_ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          if [ -n "$KEYSTORE_B64" ] &&
             [ -n "$KEYSTORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ] &&
             [ -n "$KEY_PASSWORD" ]; then

            echo "$KEYSTORE_B64" | base64 --decode \
              > "$RUNNER_TEMP/nexvora-release.jks"

            keytool -list \
              -keystore "$RUNNER_TEMP/nexvora-release.jks" \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" >/dev/null

            echo "self_signed=false" >> "$GITHUB_OUTPUT"

          else

            P=$(openssl rand -hex 24)

            keytool -genkeypair \
              -keystore "$RUNNER_TEMP/nexvora-release.jks" \
              -alias nexvora-ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$P" \
              -keypass "$P" \
              -dname "CN=NexVora Voice Studio, O=NexVora Lab's Ofc"

            KEYSTORE_PASSWORD="$P"
            KEY_ALIAS="nexvora-ci"
            KEY_PASSWORD="$P"

            echo "::add-mask::$P"
            echo "self_signed=true" >> "$GITHUB_OUTPUT"

          fi

          {
            echo "NEXVORA_ANDROID_KEYSTORE=$RUNNER_TEMP/nexvora-release.jks"
            echo "NEXVORA_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "NEXVORA_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "NEXVORA_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # 7. Unit tests
      - name: Run Unit Tests
        id: tests
        continue-on-error: true
        run: |
          ./gradlew --no-daemon testDebugUnitTest

      # 8. Build APKs
      - name: Build Debug and Release APK
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug \
            assembleRelease

      # 9. Collect APK files
      - name: Collect and Validate APKs
        working-directory: .
        run: |
          set -e

          mkdir -p dist

          DEBUG_APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="mobile/android/app/build/outputs/apk/release/app-release.apk"

          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"

          cp "$DEBUG_APK" dist/NexVora-Voice-Studio-Debug.apk
          cp "$RELEASE_APK" dist/NexVora-Voice-Studio-Release.apk

          echo "APK FILES:"
          ls -lh dist/

          echo "APK_COUNT=$(find dist -maxdepth 1 -name '*.apk' | wc -l)" \
            >> "$GITHUB_ENV"

      # 10. Verify APK signatures
      - name: Verify APK Signatures
        working-directory: .
        run: |
          set -e

          SDK_TOOLS="$ANDROID_HOME/build-tools"

          APKSIGNER=$(find "$SDK_TOOLS" \
            -name apksigner -type f | sort -V | tail -n 1)

          test -n "$APKSIGNER"

          for APK in dist/*.apk; do
            "$APKSIGNER" verify --verbose "$APK"
            echo "Verified: $APK"
          done

      # 11. Generate build report
      - name: Generate Build Summary
        if: always()
        working-directory: .
        run: |
          {
            echo "# NexVora Voice Studio"
            echo ""
            echo "## Build Information"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Branch/Tag: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo ""
            echo "## APK Files"
            if [ -d dist ]; then
              ls -lh dist/*.apk 2>/dev/null || true
            fi
            echo ""
            echo "## Unit Test Result"
            echo "Check the Unit Tests step above."
          } >> "$GITHUB_STEP_SUMMARY"

      # 12. Publish direct APK files
      - name: Publish GitHub Release
        if: >
          success() &&
          (
            startsWith(github.ref, 'refs/tags/v') ||
            (
              github.event_name == 'workflow_dispatch' &&
              inputs.release == true
            )
          )
        id: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: NexVora Voice Studio ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/NexVora-Voice-Studio-Debug.apk
            dist/NexVora-Voice-Studio-Release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            # NexVora Voice Studio

            Developed by Prince AR Abdur Rahman.
            Published by NexVora Lab's Ofc.

            ## Direct APK Downloads

            - NexVora Voice Studio Debug APK
            - NexVora Voice Studio Release APK

            APK files are attached directly.
            No ZIP extraction required.

            ## License
            AGPL-3.0

      # 13. Report completion
      - name: Final Build Status
        if: always()
        working-directory: .
        run: |
          {
            echo ""
            echo "## Final Status"
            echo "- Build job: ${{ job.status }}"
            echo "- Unit tests: ${{ steps.tests.outcome }}"
            echo "- Signing: ${{ steps.signing.outputs.self_signed }}"
          } >> "$GITHUB_STEP_SUMMARY"
          
